# Render Blueprint: https://render.com/docs/blueprint-spec
#
# When applying the Blueprint, you MUST set MONGODB_URI (and should set JWT_SECRET,
# OPS_API_KEY, FRONTEND_URL) in the prompts — empty secrets crash the app on boot.
#
# Or create a Web Service manually: rootDir backend, build npm ci --omit=dev, start npm start

services:
  - type: web
    name: optimal-backend
    runtime: node
    plan: free
    # Cannot be changed after the service is created — must match your existing service.
    region: ohio
    branch: main
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Pin Node so local and Render match; see https://render.com/docs/node-version
      - key: NODE_VERSION
        value: "22.12.0"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:5173
      - key: OPS_API_KEY
        generateValue: true
