# Deploy Node API to Azure Web App optimal-backend-test
# - main: installs backend/ and zips that folder (includes node_modules)
# - azure-backend-only: repo root is the backend; zips root after npm ci

name: Build and deploy Node.js app to Azure Web App - optimal-backend-test

on:
  push:
    branches:
      - main
      - azure-backend-only
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies and zip for Azure
        run: |
          if [ -f backend/package.json ]; then
            cd backend && npm ci --omit=dev
            zip -rq "$GITHUB_WORKSPACE/app.zip" .
          else
            npm ci --omit=dev
            zip -rq "$GITHUB_WORKSPACE/app.zip" . -x '.git/*' -x '.github/*'
          fi
          unzip -l "$GITHUB_WORKSPACE/app.zip" | head -30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CBA484B5EB3C4DC0991DAD3D31FB5F70 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_81BFC493F8DF401CA4C6367C925A8850 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0B9ADBD60ECE47AD975A0390EF8FF127 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'optimal-backend-test'
          slot-name: 'Production'
          package: app.zip
